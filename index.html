<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belajar Bahasa Korea — 한국어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff5fa; --bg2:#f1ecff; --card:rgba(255,255,255,.78); --card-solid:#fff;
  --text:#2b2140; --muted:#6f6488; --line:rgba(120,90,180,.18);
  --p1:#7c5cff; --p2:#ff5fa2; --p3:#ffb347; --ok:#22c55e; --bad:#ef4444;
  --shadow:0 10px 30px rgba(124,92,255,.16);
  --r:20px;
}
[data-theme="dark"]{
  --bg:#130f20; --bg2:#1c1533; --card:rgba(34,26,58,.78); --card-solid:#241b3f;
  --text:#f2ecff; --muted:#aa9fc8; --line:rgba(190,170,255,.18);
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Poppins','Noto Sans KR',system-ui,sans-serif;color:var(--text);
  background:linear-gradient(135deg,var(--bg),var(--bg2));background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s;
}
.kr{font-family:'Noto Sans KR','Poppins',sans-serif}
/* ---------- background ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:-2;animation:blob 18s ease-in-out infinite}
.blob.b1{width:380px;height:380px;background:var(--p1);top:-100px;left:-100px}
.blob.b2{width:420px;height:420px;background:var(--p2);bottom:-140px;right:-120px;animation-delay:-6s}
.blob.b3{width:300px;height:300px;background:var(--p3);top:40%;left:55%;animation-delay:-11s;opacity:.22}
@keyframes blob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.15)}66%{transform:translate(-40px,70px) scale(.9)}}
#floaters{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#floaters span{position:absolute;bottom:-60px;font-family:'Noto Sans KR';font-weight:900;color:var(--p1);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.16}90%{opacity:.12}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
/* ---------- header / nav ---------- */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo b{background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.3rem}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:.85rem}
.pill{padding:6px 12px;border-radius:999px;background:var(--card-solid);border:1px solid var(--line);font-weight:600;white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--card-solid);color:var(--text);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:1.05rem;transition:.25s}
.iconbtn:hover{transform:rotate(20deg) scale(1.1)}
nav{max-width:1100px;margin:auto;padding:0 12px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:12px;font:600 .88rem 'Poppins';cursor:pointer;transition:.25s}
nav button:hover{background:var(--card-solid);color:var(--text)}
nav button.active{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.35)}
.xpbar{height:4px;background:var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));transition:width .8s cubic-bezier(.2,.9,.3,1)}
/* ---------- layout ---------- */
main{max-width:1100px;margin:auto;padding:24px 16px 80px}
.view{display:none}
.view.active{display:block;animation:viewIn .55s cubic-bezier(.2,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
h2.title{font-size:1.7rem;margin-bottom:6px}
p.sub{color:var(--muted);margin-bottom:20px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.grid{display:grid;gap:14px}
.btn{border:0;cursor:pointer;font:600 .92rem 'Poppins';padding:11px 20px;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 8px 20px rgba(124,92,255,.3);transition:.25s}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(124,92,255,.42)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card-solid);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.done{background:linear-gradient(135deg,#22c55e,#10b981)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--card-solid);color:var(--text);padding:8px 14px;border-radius:999px;font:600 .85rem 'Poppins';cursor:pointer;transition:.25s}
.chip:hover{transform:translateY(-2px)}
.chip.active{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.stagger>*{opacity:0;animation:pop .5s cubic-bezier(.2,1.2,.3,1) forwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.92)}to{opacity:1;transform:none}}
.lessonend{margin-top:26px;text-align:center}
/* ---------- hero ---------- */
.hero{text-align:center;padding:30px 10px 10px}
.hero .big{font-family:'Noto Sans KR';font-weight:900;font-size:clamp(3.4rem,13vw,7rem);line-height:1.1;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite,bob 4s ease-in-out infinite}
@keyframes shine{to{background-position:300% 0}}
@keyframes bob{50%{transform:translateY(-10px)}}
.hero .typing{font-size:1.25rem;min-height:2em;font-weight:600}
.hero .typing::after{content:"|";animation:blink 1s steps(1) infinite;color:var(--p2)}
@keyframes blink{50%{opacity:0}}
.hero p{max-width:620px;margin:10px auto 22px;color:var(--muted);line-height:1.7}
.statgrid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:26px 0}
.stat{text-align:center}
.stat .n{font-size:2rem;font-weight:700;background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{color:var(--muted);font-size:.85rem}
.road{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.lesson{cursor:pointer;position:relative;transition:.3s;display:flex;gap:14px;align-items:center}
.lesson:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 16px 34px rgba(124,92,255,.28)}
.lesson .ic{font-size:2rem;width:58px;height:58px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(255,95,162,.18))}
.lesson h3{font-size:1rem}
.lesson small{color:var(--muted)}
.lesson .tick{position:absolute;top:10px;right:12px;font-size:1.2rem;opacity:.25}
.lesson.ok .tick{opacity:1;animation:tick .6s}
@keyframes tick{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.5)}100%{transform:scale(1)}}
/* ---------- flip cards ---------- */
.letters{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.flip{perspective:800px;height:160px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;border:1px solid var(--line);background:var(--card-solid);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.face .ch{font-family:'Noto Sans KR';font-weight:900;font-size:3.2rem;line-height:1}
.face .rm{font-weight:700;font-size:1.3rem;margin-top:6px}
.face small{opacity:.85;font-size:.75rem;line-height:1.35;margin-top:4px}
.flip:hover .face:not(.back){border-color:var(--p1)}
/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.builder{grid-template-columns:1fr}}
.out{text-align:center}
.out .syl{font-family:'Noto Sans KR';font-weight:900;font-size:7.5rem;line-height:1.1;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.out .syl.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(.4) rotate(-12deg);opacity:0}60%{transform:scale(1.15) rotate(3deg)}100%{transform:none;opacity:1}}
.out .rr{font-size:1.4rem;font-weight:700}
.picker h4{margin:10px 0 8px;font-size:.9rem;color:var(--muted)}
.picker .chips{margin-bottom:6px}
.picker .chip{font-family:'Noto Sans KR';font-size:1rem;padding:6px 11px}
/* ---------- numbers ---------- */
.numgrid{grid-template-columns:repeat(auto-fill,minmax(105px,1fr))}
.num{text-align:center;padding:14px 8px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line);cursor:pointer;transition:.25s}
.num:hover{transform:translateY(-5px) scale(1.05);border-color:var(--p2)}
.num b{display:block;font-size:1.5rem;color:var(--p1)}
.num span{font-family:'Noto Sans KR';font-weight:700;font-size:1.15rem}
.num small{display:block;color:var(--muted)}
.conv{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.conv input{width:110px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card-solid);color:var(--text);font:600 1.1rem 'Poppins'}
.convout{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.convout div{padding:14px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line)}
.convout .kr{font-size:1.6rem;font-weight:900}
/* ---------- vocab ---------- */
.words{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.word{display:flex;align-items:center;gap:12px;transition:.3s;cursor:pointer;padding:14px 16px}
.word:hover{transform:translateY(-4px) scale(1.02);border-color:var(--p1)}
.word .k{font-family:'Noto Sans KR';font-weight:700;font-size:1.35rem}
.word .r{color:var(--p1);font-size:.85rem;font-weight:600}
.word .m{color:var(--muted);font-size:.85rem}
.word .spk{margin-left:auto;font-size:1.3rem}
.fcwrap{max-width:460px;margin:0 auto;text-align:center}
.fcwrap .flip{height:260px}
.fcwrap .face .ch{font-size:2.6rem}
.fcwrap .face .rm{font-size:1.5rem}
.fcnav{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.fcinfo{color:var(--muted);margin-top:12px;font-size:.9rem}
.swap{animation:swap .4s}
@keyframes swap{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
/* ---------- phrases / dialog ---------- */
.phrases{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.phr{padding:14px 16px;border-radius:16px;background:var(--card-solid);border:1px solid var(--line);cursor:pointer;transition:.25s;display:flex;gap:12px;align-items:center}
.phr:hover{transform:translateX(6px);border-color:var(--p2)}
.phr .k{font-family:'Noto Sans KR';font-weight:700;font-size:1.1rem}
.phr .r{color:var(--p1);font-size:.82rem}
.phr .m{font-size:.85rem;color:var(--muted)}
.phr .spk{margin-left:auto;font-size:1.2rem}
.chat{display:flex;flex-direction:column;gap:12px;margin:14px 0}
.bub{max-width:82%;padding:12px 16px;border-radius:18px;opacity:0;transform:translateY(14px) scale(.9);animation:bubin .5s cubic-bezier(.2,1.3,.4,1) forwards;cursor:pointer}
.bub.a{align-self:flex-start;background:var(--card-solid);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.b{align-self:flex-end;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-bottom-right-radius:4px}
.bub .k{font-family:'Noto Sans KR';font-weight:700}
.bub small{display:block;opacity:.8;font-size:.78rem}
@keyframes bubin{to{opacity:1;transform:none}}
/* ---------- grammar ---------- */
.acc{margin-bottom:12px;overflow:hidden;padding:0}
.acc>button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:16px 20px;font:700 1rem 'Poppins';cursor:pointer;display:flex;align-items:center;gap:10px}
.acc>button::after{content:"＋";margin-left:auto;transition:.3s;color:var(--p2);font-size:1.2rem}
.acc.open>button::after{transform:rotate(135deg)}
.acc .body{max-height:0;overflow:hidden;transition:max-height .5s ease;padding:0 20px}
.acc.open .body{max-height:700px}
.acc .rule{padding:4px 0 12px;color:var(--muted);line-height:1.7}
.acc .ex{padding:10px 14px;margin-bottom:10px;border-radius:12px;background:var(--card-solid);border-left:4px solid var(--p2);cursor:pointer}
.acc .ex .k{font-family:'Noto Sans KR';font-weight:700;font-size:1.1rem}
.acc .ex .r{color:var(--p1);font-size:.82rem}
.acc .ex .m{font-size:.85rem;color:var(--muted)}
.acc .body::after{content:"";display:block;height:10px}
/* ---------- quiz ---------- */
.qbox{max-width:640px;margin:auto;text-align:center}
.qprog{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:18px}
.qprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .5s}
.qq{font-family:'Noto Sans KR';font-weight:900;font-size:3rem;margin:10px 0}
.qq.small{font-size:2rem}
.qhint{color:var(--muted);margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card-solid);color:var(--text);font:600 1rem 'Poppins','Noto Sans KR';cursor:pointer;transition:.25s}
.opt:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p1)}
.opt.right{background:rgba(34,197,94,.18);border-color:var(--ok);animation:pulse .5s}
.opt.wrong{background:rgba(239,68,68,.16);border-color:var(--bad);animation:shake .45s}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{min-height:48px;margin-top:16px;font-weight:600}
.score{font-size:4rem;font-weight:900;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:600;z-index:300;transition:.45s cubic-bezier(.2,1.3,.4,1);opacity:0}
#toast.show{transform:translate(-50%,0);opacity:1}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
/* ---------- extra features ---------- */
.wstage{position:relative;width:min(100%,400px);aspect-ratio:1/1;margin:0 auto;border-radius:22px;overflow:hidden;background-color:var(--card-solid);border:2px solid var(--line);box-shadow:var(--shadow);background-image:linear-gradient(to right,transparent 49.6%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.4%),linear-gradient(to bottom,transparent 49.6%,var(--line) 49.6%,var(--line) 50.4%,transparent 50.4%)}
.wstage canvas{position:absolute;inset:0;width:100%;height:100%}
#wDraw{touch-action:none;cursor:crosshair}
.wtarget{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;text-align:center}
.wtarget .kr{font-size:2.4rem;font-weight:900}
.ring{width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--p2) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative;flex:none;transition:.6s}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card-solid)}
.ring span{position:relative;font-weight:700}
.goalcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.goalcard .quick{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.badges{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.badge{text-align:center;padding:18px 12px}
.badge .bi{font-size:2.6rem}
.badge h4{margin:6px 0 2px}
.badge small{color:var(--muted)}
.badge.lock{filter:grayscale(1);opacity:.45}
.sbarea{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:16px;border:2px dashed var(--line);background:var(--card-solid);margin:12px 0;justify-content:center}
.sbchip{border:1px solid var(--line);background:var(--card-solid);color:var(--text);padding:10px 16px;border-radius:12px;font:700 1.1rem 'Noto Sans KR','Poppins';cursor:pointer;transition:.2s;box-shadow:0 4px 10px rgba(124,92,255,.12)}
.sbchip:hover{transform:translateY(-3px);border-color:var(--p1)}
.sbchip.placed{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.sbarea.okk{border-color:var(--ok);background:rgba(34,197,94,.12)}
.sbarea.bad{animation:shake .45s;border-color:var(--bad)}
.star{background:none;border:0;font-size:1.4rem;cursor:pointer;transition:.25s;margin-left:auto}
.star:hover{transform:scale(1.35) rotate(15deg)}
.search{width:100%;padding:14px 18px;border-radius:16px;border:1px solid var(--line);background:var(--card-solid);color:var(--text);font:500 1rem 'Poppins','Noto Sans KR';margin-bottom:14px}
.lopt{padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--card-solid);color:var(--text);font:600 1rem 'Poppins','Noto Sans KR';cursor:pointer;transition:.25s}
.lopt.kr{font-size:1.5rem;font-weight:700}
.lopt:hover:not(:disabled){transform:translateY(-4px);border-color:var(--p1)}
.lopt.right{background:rgba(34,197,94,.18);border-color:var(--ok);animation:pulse .5s}
.lopt.wrong{background:rgba(239,68,68,.16);border-color:var(--bad);animation:shake .45s}
.srsgrid{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:16px 0}
.gbtn{display:flex;flex-direction:column;gap:2px;line-height:1.2}
.gbtn small{font-weight:500;opacity:.85}
#v-culture .acc.open .body{max-height:1600px}
.acc .body p{margin-bottom:10px;line-height:1.7;color:var(--muted)}
.acc .body ul{margin:0 0 12px 20px;color:var(--muted);line-height:1.7}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--line);font-size:.75rem;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="floaters"></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>

<header>
  <div class="bar">
    <div class="logo" data-go="home">🇰🇷 <b class="kr">한국어</b> <span>Belajar Korea</span></div>
    <div class="stats">
      <span class="pill" id="stLevel">Lv 1</span>
      <span class="pill" id="stXp">⭐ 0 XP</span>
      <span class="pill" id="stStreak">🔥 1 hari</span>
      <button class="iconbtn" id="themeBtn" title="Mode gelap / terang">🌙</button>
    </div>
  </div>
  <nav id="nav">
    <button data-go="home" class="active">🏠 Beranda</button>
    <button data-go="hangul">🔤 Hangul</button>
    <button data-go="write">✍️ Tulis</button>
    <button data-go="builder">🧩 Rangkai</button>
    <button data-go="numbers">🔢 Angka</button>
    <button data-go="vocab">📚 Kosakata</button>
    <button data-go="srs">🔁 Review</button>
    <button data-go="phrases">💬 Percakapan</button>
    <button data-go="sentence">🧱 Kalimat</button>
    <button data-go="grammar">📖 Tata Bahasa</button>
    <button data-go="culture">🎌 Budaya</button>
    <button data-go="listen">🎧 Dengar</button>
    <button data-go="quiz">🎯 Kuis</button>
    <button data-go="dict">🔍 Kamus</button>
    <button data-go="tools">🛠️ Alat</button>
    <button data-go="badges">🏅 Lencana</button>
  </nav>
  <div class="xpbar"><i id="xpFill"></i></div>
</header>

<main>
  <section class="view active" id="v-home"></section>

const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],run=false;

function confetti(n=120){
  const cols=['#7c5cff','#ff5fa2','#ffb347','#22c55e','#38bdf8'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,g:.35,s:Math.random()*8+4,c:cols[rnd(5)],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:120+rnd(60)});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/40);cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}

let typeTimer;
function startTyping(){
  clearTimeout(typeTimer);
  const words=['안녕하세요! (Halo!)','감사합니다 (Terima kasih)','사랑해요 (Aku cinta kamu)','화이팅! (Semangat!)','한국어는 재미있어요 (Korea itu seru)'];
  let w=0,c=0,del=false;
  (function step(){
    const el=$('#typing');if(!el)return;
    const s=words[w];
    el.textContent=s.slice(0,c);
    if(!del&&c<s.length){c++;typeTimer=setTimeout(step,90)}
    else if(!del){del=true;typeTimer=setTimeout(step,1400)}
    else if(c>0){c--;typeTimer=setTimeout(step,35)}
    else{del=false;w=(w+1)%words.length;typeTimer=setTimeout(step,300)}
  })();
}

const ALL_LETTERS=()=>[...LEAD.map(x=>({c:x[0],r:x[1]||'ng / –'})),...VOW.map(x=>({c:x[0],r:x[1]}))];
function qHangul(){
  const all=ALL_LETTERS(),a=all[rnd(all.length)];
  const wrong=pick(all.filter(x=>x.r!==a.r),20);const seen=new Set([a.r]),o=[a.r];
  for(const w of wrong){if(!seen.has(w.r)){seen.add(w.r);o.push(w.r)}if(o.length===4)break}
  return {q:a.c,hint:'Bagaimana cara membaca huruf ini?',opts:shuffle(o),ans:a.r,exp:HINT[a.c]||'',say:syl(LEAD.findIndex(x=>x[0]===a.c)>=0?LEAD.findIndex(x=>x[0]===a.c):11,LEAD.findIndex(x=>x[0]===a.c)>=0?0:VOW.findIndex(x=>x[0]===a.c))};
}
function qVocab(){
  const all=Object.values(VOCAB).flat(),a=all[rnd(all.length)],rev=Math.random()<.4;
  const wrong=pick(all.filter(x=>x[0]!==a[0]),3);
  if(!rev)return {q:a[0],hint:'Apa arti kata ini?',opts:shuffle([a[2],...wrong.map(x=>x[2])]),ans:a[2],exp:a[0]+' ('+a[1]+') = '+a[2],say:a[0]};
  return {q:a[2],small:1,hint:'Bagaimana bahasa Koreanya?',opts:shuffle([a[0],...wrong.map(x=>x[0])]),ans:a[0],exp:a[0]+' ('+a[1]+') = '+a[2],say:a[0]};
}
function qNumber(){
  const n=1+rnd(99),sin=Math.random()<.5,k=sin?sino(n):native(n);
  const set=new Set([n]);while(set.size<4){const d=Math.max(1,Math.min(99,n+(rnd(9)-4)));set.add(d)}
  return {q:k,hint:'Angka berapa ini? ('+(sin?'Sino-Korea':'Native Korea')+')',opts:shuffle([...set].map(String)),ans:String(n),exp:k+' = '+n,say:k};
}

const allWords=()=>Object.entries(VOCAB).flatMap(([c,a])=>a.map(w=>({k:w[0],r:w[1],m:w[2],c})));
const FIN_R=['','k','k','k','n','n','n','t','l','k','m','l','l','l','p','l','m','p','p','t','t','ng','t','t','k','t','p','t'];
function han2rom(s){return [...s].map(c=>{const n=c.charCodeAt(0)-0xAC00;if(n<0||n>11171)return c;const T=n%28,V=(n/28|0)%21,L=n/588|0;return LEAD[L][1]+VOW[V][1]+FIN_R[T]}).join('')}
const INI=[['kk',1],['tt',4],['pp',8],['ss',10],['jj',13],['ch',14],['g',0],['n',2],['d',3],['r',5],['l',5],['m',6],['b',7],['s',9],['j',12],['k',15],['t',16],['p',17],['h',18]];
const VW=[['yae',3],['yeo',6],['wae',10],['eo',4],['eu',18],['ya',2],['ye',7],['yo',12],['yu',17],['wa',9],['we',15],['wi',16],['wo',14],['oe',11],['ui',19],['ae',1],['a',0],['e',5],['i',20],['o',8],['u',13]];
const FN=[['ng',21],['k',1],['g',1],['n',4],['t',7],['d',7],['l',8],['r',8],['m',16],['p',17],['b',17]];
function rom2han(str){
  const startsV=(s,p)=>VW.some(([r])=>s.startsWith(r,p));
  const one=w=>{let out='',i=0;
    while(i<w.length){
      let L=11;const ini=INI.find(([r])=>w.startsWith(r,i)&&startsV(w,i+r.length));
      if(ini){L=ini[1];i+=ini[0].length}
      const vw=VW.find(([r])=>w.startsWith(r,i));
      if(!vw){out+=w[i];i++;continue}
      i+=vw[0].length;let T=0;
      const fin=FN.find(([r])=>w.startsWith(r,i)&&!(i+r.length<w.length&&startsV(w,i+r.length)));
      if(fin){T=fin[1];i+=fin[0].length}
      out+=syl(L,vw[1],T);
    }return out};
  return str.toLowerCase().split(' ').map(w=>w.split('-').map(one).join('')).join(' ');
}

function wRom(ch){
  const j=LEAD.find(x=>x[0]===ch);if(j)return j[1]||'ng / –';
  const v=VOW.find(x=>x[0]===ch);if(v)return v[1];
  const w=allWords().find(x=>x.k===ch);if(w)return w.r+' — '+w.m;
  return han2rom(ch);
}
function wGlyph(c,ch,col,stroke){
  const size=Math.min(300,Math.floor(340/[...ch].length));
  c.font=`700 ${size}px 'Noto Sans KR',sans-serif`;c.textAlign='center';c.textBaseline='middle';
  c.fillStyle=col;c.fillText(ch,200,205);
  if(stroke){c.lineWidth=stroke;c.lineJoin='round';c.strokeStyle=col;c.strokeText(ch,200,205)}
}
function wGuide(){
  const g=$('#wGuide');if(!g)return;const c=g.getContext('2d');c.clearRect(0,0,400,400);
  if(W.guide)wGlyph(c,W.list[W.i],'rgba(124,92,255,.25)');
}
function wSetup(){
  const cvs=$('#wDraw');if(!cvs)return;
  const c=cvs.getContext('2d'),d=W.dil.getContext('2d');
  [c,d].forEach(x=>{x.lineCap='round';x.lineJoin='round'});
  const pos=e=>{const r=cvs.getBoundingClientRect();return [(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*400/r.height]};
  const seg=(x1,y1,x2,y2)=>{c.strokeStyle='#ff5fa2';c.lineWidth=22;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();d.strokeStyle='#000';d.lineWidth=64;d.beginPath();d.moveTo(x1,y1);d.lineTo(x2,y2);d.stroke()};
  cvs.onpointerdown=e=>{e.preventDefault();try{cvs.setPointerCapture(e.pointerId)}catch(_){}W.drawing=true;[W.lx,W.ly]=pos(e);seg(W.lx,W.ly,W.lx+.01,W.ly+.01);W.dirty=true};
  cvs.onpointermove=e=>{if(!W.drawing)return;const [x,y]=pos(e);seg(W.lx,W.ly,x,y);W.lx=x;W.ly=y};
  cvs.onpointerup=cvs.onpointercancel=()=>{W.drawing=false};
}
function wClear(){
  const c=$('#wDraw');if(!c)return;c.getContext('2d').clearRect(0,0,400,400);W.dil.getContext('2d').clearRect(0,0,400,400);
  W.dirty=false;const f=$('#wFb');if(f)f.innerHTML='';
}
function wCheck(){
  const fb=$('#wFb');
  if(!W.dirty){fb.innerHTML='✏️ Tulis dulu hurufnya ya!';return}
  const ch=W.list[W.i],N=400;
  const mk=st=>{const k=document.createElement('canvas');k.width=k.height=N;const x=k.getContext('2d');wGlyph(x,ch,'#000',st);return x.getImageData(0,0,N,N).data};
  const gd=mk(0),td=mk(46);
  const ud=$('#wDraw').getContext('2d').getImageData(0,0,N,N).data;
  const dd=W.dil.getContext('2d').getImageData(0,0,N,N).data;
  let gp=0,cov=0,up=0,ok=0;
  for(let p=0;p<N*N;p+=2){const o=p*4+3;
    if(gd[o]>100){gp++;if(dd[o]>100)cov++}
    if(ud[o]>100){up++;if(td[o]>100)ok++}}
  const c=gp?cov/gp:0,pr=up?ok/up:0;
  let msg,pass=false;
  if(c>=.75&&pr>=.8){msg='⭐⭐⭐ Sempurna! 완벽해요!';pass=true}
  else if(c>=.6&&pr>=.7){msg='⭐⭐ Bagus! 잘했어요!';pass=true}
  else if(c>=.45&&pr>=.55){msg='⭐ Lumayan! Coba ikuti bentuknya lebih rapi.';pass=true}
  else if(pr<.55)msg='🤔 Coretanmu banyak keluar dari bentuk huruf. Coba lagi pelan-pelan.';
  else msg='🤔 Bentuk hurufnya belum lengkap. Ikuti panduan sampai selesai.';
  fb.innerHTML=`${msg}<br><small>Kemiripan: ${Math.round(c*100)}% · Ketepatan: ${Math.round(pr*100)}%</small>`;
  if(pass&&!W.passed){W.passed=true;S.written++;save();addXP(3)}
}

const INTV=[0,1,2,4,8,16,32];
let SR={q:[],total:0,done:0,cur:null};
function srsStats(){
  const all=allWords(),t=DAY();let n=0,l=0,h=0,due=0;
  all.forEach(w=>{const e=S.srs[w.k];if(!e)n++;else{if(e.b>=4)h++;else l++;if(e.d<=t)due++}});
  return {n,l,h,due,t:all.length};
}
function renderSrs(){

  $('#v-srs').innerHTML=`
  <h2 class="title">🔁 Review Cerdas</h2>
  <p class="sub">Sistem pengulangan berjarak: kata yang kamu lupa akan muncul lebih sering, kata yang sudah hafal muncul makin jarang (1, 2, 4, 8, 16… hari). Cara paling efektif untuk menghafal kosakata!</p>

    <div class="card stat" style="--i:1"><div class="n">${s.n}</div><div class="l">Kata baru</div></div>
    <div class="card stat" style="--i:2"><div class="n">${s.l}</div><div class="l">Sedang dipelajari</div></div>

  </div>
  <div class="card" style="text-align:center"><button class="btn" id="srsStart">▶ Mulai sesi review</button>
   <p class="sub" style="margin:12px 0 0">Satu sesi berisi maksimal 20 kartu jatuh tempo + 10 kata baru dari ${s.t} kata.</p></div>
  ${doneBtn('srs')}`;
}
function srsStart(){
  const all=allWords(),t=DAY();
  const due=all.filter(w=>S.srs[w.k]&&S.srs[w.k].d<=t),fresh=all.filter(w=>!S.srs[w.k]);
  SR.q=[...shuffle(due).slice(0,20),...shuffle(fresh).slice(0,10)];SR.total=SR.q.length;SR.done=0;
  if(!SR.q.length){toast('Tidak ada kartu untuk direview. Kembali besok! 🎉');return}
  srsCard();
}
function srsCard(){
  if(!SR.q.length){srsEnd();return}
  const w=SR.q[0],e=S.srs[w.k]||{b:0,d:0},nb=Math.min(6,e.b+1);
  $('#v-srs').innerHTML=`<div class="fcwrap card">
    <div class="qprog"><i style="width:${SR.done/Math.max(1,SR.done+SR.q.length)*100}%"></i></div>
    <small>Sisa kartu: ${SR.q.length} · <span class="tag">${w.c}</span></small>
    <div class="swap" style="margin-top:12px"><div class="flip" id="srsFlip" data-say="${w.k}"><div class="flip-in">
      <div class="face"><div class="ch">${w.k}</div><small>Ingat artinya, lalu klik kartu</small></div>
      <div class="face back"><div class="rm">${w.m}</div><div style="margin-top:6px">${w.r}</div></div></div></div></div>
    <div class="fcnav" id="srsBtns" style="display:none">
      <button class="btn ghost gbtn" data-srs="0">😵 Lupa<small>ulang sebentar lagi</small></button>
      <button class="btn ghost gbtn" data-srs="1">😐 Sulit<small>besok</small></button>
      <button class="btn gbtn" data-srs="2">😄 Mudah<small>${INTV[nb]} hari lagi</small></button></div>
  </div>`;
}
function srsGrade(g){
  const w=SR.q.shift(),e=S.srs[w.k]||{b:0,d:0},t=DAY();
  if(g===0){e.b=1;e.d=t;SR.q.splice(Math.min(3,SR.q.length),0,w)}
  else if(g===1){e.b=Math.max(1,e.b);e.d=t+1;SR.done++}
  else{e.b=Math.min(6,e.b+1);e.d=t+INTV[e.b];SR.done++}
  S.srs[w.k]=e;S.reviews++;save();srsCard();
}
function srsEnd(){
  const n=SR.total;confetti(120);addXP(Math.max(1,n));
  $('#v-srs').innerHTML=`<div class="qbox card"><div class="score">${n}</div><h3>Sesi selesai! 🎉</h3>

   <button class="btn" data-go="srs">Kembali</button></div>`;
  SR.total=0;
}

  const n=1+rnd(99),sin=Math.random()<.5,k=sin?sino(n):native(n),set=new Set([n]);
  while(set.size<4)set.add(Math.max(1,Math.min(99,n+rnd(11)-5)));
  return {say:k,hint:'Angka berapa yang kamu dengar? ('+(sin?'Sino-Korea':'Native')+')',opts:shuffle([...set].map(String)),ans:String(n),exp:k+' = '+n};
}
let L={qs:[],i:0,score:0,locked:false,mode:'mix'};
function renderListenMenu(){
  $('#v-listen').innerHTML=`
  <h2 class="title">🎧 Latihan Mendengar</h2>
  <p class="sub">Dengarkan suara bahasa Korea, lalu pilih jawaban yang benar. Kamu bisa memutar ulang atau memutar dengan kecepatan pelan. Pastikan volume menyala dan browser mendukung suara Korea.</p>
  <div class="grid stagger" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
   ${[['mix','🎲','Campuran','Semua jenis'],['syl','🔤','Suku Kata','Bedakan bunyi'],['word','📚','Kata','Tulisan & arti'],['num','🔢','Angka','Dengar angka']].map((m,i)=>`<div class="card lesson" style="--i:${i}" data-lstart="${m[0]}"><div class="ic">${m[1]}</div><div><h3>${m[2]}</h3><small>${m[3]}</small></div></div>`).join('')}
  </div>${doneBtn('listen')}`;
}
function lsStart(mode){
  const g={syl:lsSyl,word:lsWord,num:lsNum},k=Object.keys(g);
  L={qs:[...Array(10)].map(()=>(mode==='mix'?g[k[rnd(3)]]:g[mode])()),i:0,score:0,locked:false,mode};
  lsRender();
}
function lsRender(){
  const q=L.qs[L.i];L.locked=false;
  $('#v-listen').innerHTML=`<div class="qbox card">
   <div class="qprog"><i style="width:${L.i/L.qs.length*100}%"></i></div>
   <small>Soal ${L.i+1} / ${L.qs.length} · Skor ${L.score}</small>
   <div style="margin:18px 0"><button class="btn" style="font-size:1.5rem;padding:16px 30px" data-say="${q.say}">🔊 Putar</button> <button class="btn ghost" data-slow="${q.say}">🐢 Pelan</button></div>
   <div class="qhint">${q.hint}</div>
   <div class="opts">${q.opts.map(o=>`<button class="lopt ${q.kr?'kr':''}" data-lopt="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div>
   <div class="fb" id="lfb"></div>
   <button class="btn" id="lNext" style="display:none">${L.i+1===L.qs.length?'Lihat Hasil 🏁':'Lanjut →'}</button></div>`;
  setTimeout(()=>speak(q.say),350);
}
function lsAnswer(b){
  if(L.locked)return;L.locked=true;
  const q=L.qs[L.i],ok=b.dataset.lopt===q.ans;
  $$('.lopt').forEach(x=>{x.disabled=true;if(x.dataset.lopt===q.ans)x.classList.add('right')});
  if(ok){L.score++;S.listened++;S.xp+=5;save();paintStats();$('#lfb').innerHTML='✅ Benar! '+q.exp}
  else{b.classList.add('wrong');$('#lfb').innerHTML='❌ Kurang tepat. '+q.exp}
  $('#lNext').style.display='inline-block';
}
function lsEnd(){
  const pct=L.score*10;if(pct>=70)confetti(150);
  $('#v-listen').innerHTML=`<div class="qbox card"><div class="score">${pct}%</div><h3>${pct>=70?'Telingamu tajam! 🎧':'Terus berlatih! 💪'}</h3>
   <p class="sub" style="margin-top:8px">Benar ${L.score} dari ${L.qs.length} soal.</p>
   <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-lstart="${L.mode}">🔁 Main lagi</button><button class="btn ghost" data-go="listen">Ganti mode</button></div></div>`;
}

/* =====================================================
   KAMUS & FAVORIT
===================================================== */
let D={q:'',fav:false};
function dictItems(){
  const out=allWords().map(w=>({...w}));
  Object.entries(PHRASES).forEach(([c,a])=>a.forEach(w=>out.push({k:w[0],r:w[1],m:w[2],c:'Frasa · '+c})));
  return out;
}
function paintDict(){
  const q=D.q.trim().toLowerCase();
  const items=dictItems().filter(w=>(!D.fav||S.favs.includes(w.k))&&(!q||w.k.includes(q)||w.r.toLowerCase().includes(q)||w.m.toLowerCase().includes(q)));
  $('#dList').innerHTML=items.length?items.slice(0,80).map(w=>`<div class="card word" data-say="${w.k.replace('○○','지수')}"><div><div class="k">${w.k}</div><div class="r">${w.r}</div><div class="m">${w.m} · <span class="tag">${w.c}</span></div></div><button class="star" data-fav="${w.k}" title="Favorit">${S.favs.includes(w.k)?'⭐':'☆'}</button></div>`).join(''):'<p class="sub">Tidak ada hasil. Coba kata lain 🙂</p>';
  $('#dCount').textContent=items.length+' hasil'+(items.length>80?' (menampilkan 80 teratas)':'');
}
function renderDict(){
  $('#v-dict').innerHTML=`
  <h2 class="title">🔍 Kamus & Favorit</h2>
  <p class="sub">Cari kata atau frasa dalam bahasa Korea, romanisasi, atau bahasa Indonesia. Tekan ☆ untuk menyimpan ke favorit.</p>
  <input class="search" id="dq" placeholder="Cari… (contoh: terima kasih / gamsa / 감사)" value="${D.q}">
  <div class="chips"><button class="chip ${D.fav?'active':''}" id="dFav">⭐ Favorit saja (${S.favs.length})</button><span class="tag" id="dCount" style="align-self:center"></span></div>
  <div class="grid words" id="dList"></div>`;
  paintDict();
}

/* =====================================================
   ALAT BANTU
===================================================== */
function renderTools(){
  $('#v-tools').innerHTML=`
  <h2 class="title">🛠️ Alat Bantu</h2>
  <p class="sub">Dua konverter sederhana untuk membantu belajar mengetik dan membaca Hangul.</p>
  <div class="card"><h3>⌨️ Romanisasi → Hangul</h3>
   <p class="sub" style="margin:6px 0 12px">Ketik bunyi Latin, hasilnya otomatis jadi Hangul. Pisahkan suku kata dengan tanda <b>-</b> jika hasilnya salah (contoh: <i>hanguk-eo</i> → 한국어). Konsonan akhir: k, n, t, l, m, p, ng.</p>
   <input class="search" id="tkIn" placeholder="contoh: annyeonghaseyo" autocomplete="off"><div class="convout"><div><small>Hasil Hangul</small><div class="kr" id="tkOut">—</div></div></div>
   <button class="btn ghost" id="tkSay" style="margin-top:12px">🔊 Dengarkan</button></div>
  <div class="card" style="margin-top:16px"><h3>🔤 Hangul → Romanisasi</h3>
   <p class="sub" style="margin:6px 0 12px">Tempel atau ketik Hangul, lihat cara bacanya. (Versi sederhana: perubahan bunyi antar suku kata belum diterapkan.)</p>
   <input class="search kr" id="trIn" placeholder="contoh: 감사합니다" autocomplete="off"><div class="convout"><div><small>Romanisasi</small><div style="font-size:1.5rem;font-weight:700" id="trOut">—</div></div></div>
   <button class="btn ghost" id="trSay" style="margin-top:12px">🔊 Dengarkan</button></div>
  <div class="card" style="margin-top:16px"><h3>📱 Tips mengetik Hangul</h3>
   <p class="sub" style="margin:8px 0 0"><b>HP:</b> tambahkan keyboard “Korean” di pengaturan bahasa/keyboard (Gboard atau iOS). <b>Windows / macOS:</b> tambahkan bahasa Korea di pengaturan input. Kamu bisa mengetik dengan susunan 2-set (두벌식) yang paling umum.</p></div>`;
}

/* =====================================================
   LENCANA & PENCAPAIAN
===================================================== */
const BADGES=[
 ['first','🌱','Langkah Pertama','Selesaikan 1 pelajaran',()=>Object.keys(S.done).length>=1],
 ['half','📘','Setengah Jalan','Selesaikan separuh pelajaran',()=>Object.keys(S.done).length>=Math.ceil(LESSONS.length/2)],
 ['all','🎓','Lulusan Hangul','Selesaikan semua pelajaran',()=>LESSONS.every(l=>S.done[l.id])],
 ['xp100','⭐','100 XP','Kumpulkan 100 XP',()=>S.xp>=100],
 ['xp500','🌟','500 XP','Kumpulkan 500 XP',()=>S.xp>=500],
 ['xp1000','💫','1000 XP','Kumpulkan 1000 XP',()=>S.xp>=1000],
 ['str3','🔥','Streak 3 Hari','Belajar 3 hari beruntun',()=>S.streak>=3],
 ['str7','🚀','Streak 7 Hari','Belajar 7 hari beruntun',()=>S.streak>=7],
 ['q70','🎯','Kuis Lulus','Skor kuis ≥ 70%',()=>S.best>=70],
 ['q100','🏆','Sempurna!','Skor kuis 100%',()=>S.best>=100],
 ['w10','✍️','Penulis Hangul','Lulus 10 latihan menulis',()=>S.written>=10],
 ['r30','🔁','Rajin Mengulang','Review 30 kartu',()=>S.reviews>=30],
 ['l10','🎧','Telinga Tajam','10 jawaban benar mendengar',()=>S.listened>=10],
 ['s10','🧱','Penyusun Kalimat','10 kalimat tersusun benar',()=>S.sentOK>=10],
 ['fav5','📌','Kolektor Kata','Simpan 5 kata favorit',()=>S.favs.length>=5],
 ['goal','🎁','Target Harian','Capai target harian',()=>S.goalDays>=1]
];
function checkBadges(){
  let ch=false;
  if(dailyXP()>=S.goal&&S.goalDone!==S.dayKey){S.goalDone=S.dayKey;S.goalDays++;ch=true;toast('🎁 Target harian tercapai!');confetti(100)}
  BADGES.forEach(b=>{if(!S.badges[b[0]]&&b[4]()){S.badges[b[0]]=1;ch=true;toast('🏅 Lencana baru: '+b[2]);confetti(80)}});
  if(ch)save();
}
const _ps=paintStats;
paintStats=function(){_ps();checkBadges()};
function renderBadges(){
  const got=BADGES.filter(b=>S.badges[b[0]]).length,mast=Object.values(S.srs).filter(e=>e.b>=4).length;
  $('#v-badges').innerHTML=`
  <h2 class="title">🏅 Pencapaian</h2>
  <p class="sub">Kumpulkan lencana dengan rajin belajar. ${got} dari ${BADGES.length} lencana terbuka.</p>
  <div class="card goalcard">${ringHTML()}
   <div><h3>🎯 Target Harian</h3><p class="sub" style="margin:4px 0 0">${Math.max(0,dailyXP())} / ${S.goal} XP hari ini · Tercapai ${S.goalDays} hari</p></div>
   <div class="quick">${[30,50,100].map(g=>`<button class="chip ${S.goal===g?'active':''}" data-goal="${g}">${g} XP</button>`).join('')}</div></div>
  <div class="grid statgrid stagger">
   <div class="card stat" style="--i:0"><div class="n">Lv ${lvl()}</div><div class="l">Level</div></div>
   <div class="card stat" style="--i:1"><div class="n">${mast}</div><div class="l">Kata dikuasai</div></div>
   <div class="card stat" style="--i:2"><div class="n">${S.written}</div><div class="l">Huruf ditulis</div></div>
   <div class="card stat" style="--i:3"><div class="n">${S.reviews}</div><div class="l">Kartu direview</div></div>
   <div class="card stat" style="--i:4"><div class="n">${S.sentOK}</div><div class="l">Kalimat benar</div></div>
   <div class="card stat" style="--i:5"><div class="n">${S.listened}</div><div class="l">Mendengar benar</div></div>
  </div>
  <div class="grid badges stagger">${BADGES.map((b,i)=>`<div class="card badge ${S.badges[b[0]]?'':'lock'}" style="--i:${i}"><div class="bi">${b[1]}</div><h4>${b[2]}</h4><small>${b[3]}</small></div>`).join('')}</div>
  <div style="text-align:center;margin-top:30px"><button class="btn ghost" id="resetAll">🗑️ Reset semua progres</button></div>`;
}

/* ---------- routing tambahan ---------- */
function extraGo(v){
  if(v==='write')renderWrite();
  if(v==='srs')renderSrs();
  if(v==='sentence')renderSentMenu();
  if(v==='listen')renderListenMenu();
  if(v==='dict')renderDict();
  if(v==='tools')renderTools();
  if(v==='badges')renderBadges();
  checkBadges();
}

/* ---------- event tambahan ---------- */
document.addEventListener('click',e=>{
  const t=e.target;let el;
  if(el=t.closest('[data-wset]')){W.set=el.dataset.wset;wLoad();renderWrite();return}
  if(t.closest('#wClear')){wClear();return}
  if(t.closest('#wGuideBtn')){W.guide=!W.guide;$('#wGuideBtn').textContent=W.guide?'🙈 Sembunyikan panduan':'👀 Tampilkan panduan';wGuide();return}
  if(t.closest('#wCheck')){wCheck();return}
  if(t.closest('#wNext')){W.i++;if(W.i>=W.list.length){if(W.set==='suku'||W.set==='kata')wLoad();W.i=0}renderWrite();return}
  if(t.closest('#srsStart')){srsStart();return}
  if(t.closest('#srsFlip')){const b=$('#srsBtns');if(b)b.style.display='flex';return}
  if(el=t.closest('[data-srs]')){srsGrade(+el.dataset.srs);return}
  if(t.closest('#sbStart')){sbStart();return}
  if(el=t.closest('[data-sbb]')){if(!SB.ok){SB.placed.push(+el.dataset.sbb);sbPaint()}return}
  if(el=t.closest('[data-sbp]')){if(!SB.ok){SB.placed=SB.placed.filter(x=>x!==+el.dataset.sbp);sbPaint()}return}
  if(t.closest('#sbReset')){SB.placed=[];sbPaint();return}
  if(t.closest('#sbHint')){sbHint();return}
  if(t.closest('#sbCheck')){sbCheck();return}
  if(t.closest('#sbNext')){SB.i++;SB.i<SB.list.length?sbQ():sbEnd();return}
  if(el=t.closest('[data-lstart]')){lsStart(el.dataset.lstart);return}
  if(el=t.closest('[data-slow]')){speak(el.dataset.slow,.45);return}
  if(el=t.closest('.lopt')){lsAnswer(el);return}
  if(t.closest('#lNext')){L.i++;L.i<L.qs.length?lsRender():lsEnd();return}
  if(el=t.closest('[data-fav]')){e.stopPropagation();const k=el.dataset.fav,i=S.favs.indexOf(k);i>=0?S.favs.splice(i,1):S.favs.push(k);save();paintDict();checkBadges();const fb=$('#dFav');if(fb)fb.textContent='⭐ Favorit saja ('+S.favs.length+')';return}
  if(t.closest('#dFav')){D.fav=!D.fav;renderDict();return}
  if(el=t.closest('[data-goal]')){S.goal=+el.dataset.goal;save();renderBadges();return}
  if(t.closest('#tkSay')){const v=$('#tkOut').textContent;if(v&&v!=='—')speak(v);return}
  if(t.closest('#trSay')){const v=$('#trIn').value;if(v)speak(v);return}
  if(t.closest('#resetAll')){if(confirm('Yakin ingin menghapus semua progres belajar?')){try{localStorage.removeItem(KEY)}catch(_){}location.reload()}return}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='dq'){D.q=e.target.value;paintDict()}
  if(id==='tkIn'){const v=rom2han(e.target.value);$('#tkOut').textContent=v||'—'}
  if(id==='trIn'){$('#trOut').textContent=han2rom(e.target.value)||'—'}
  if(id==='ckH'||id==='ckM')paintClock();
});

/* init */
renderHome();renderHangul();renderBuilder();renderNumbers();resetCards();renderVocab();renderPhrases();renderGrammar();renderQuizMenu();renderCulture();paintStats();
</script>
